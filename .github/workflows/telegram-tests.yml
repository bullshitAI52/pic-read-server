name: Telegram gateway tests
on:
  push:
    branches: [feature/crop-assist]
    paths: ['telegram/**', '.github/workflows/telegram-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r telegram/requirements.txt
      - run: python -m unittest discover -s telegram -p 'test_*.py'
